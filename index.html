    <title>一厘米，四十公里 · 吉韵新程黑土数字展馆</title>
    <meta name="description" content="长春市大学生网页设计作品：以 Vue 3 与 Three.js 构建的乡村振兴数字展馆，包含黑土地质标本、北斗智慧农机与松辽平原生态沙盘三座实时 3D 展厅及互动科普实验室。" />
    <meta name="author" content="长春市高校大学生网页设计作品" />

    <meta property="og:image" content="/art/panorama.svg" />
    <meta name="twitter:card" content="summary_large_image" />
